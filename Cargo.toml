[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
deadpool-postgres = "0.14"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde_json = "1"
serde_path_to_error = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "fs", "signal"] }
tokio-postgres = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Debug builds are intentionally never used (see AGENT.md); keep release lean.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
