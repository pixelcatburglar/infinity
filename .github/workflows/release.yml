name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '!v0[0-9]+.*'
      - '!v*.0[0-9]+.*'
      - '!v*.*.0[0-9]+'

permissions:
  contents: read

env:
  RUSTFLAGS: -D warnings

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify tag and main ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

  test-linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - run: cargo build --release --locked --workspace --all-targets
      - run: cargo test --release --locked --workspace

  package:
    needs: test-linux
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        shell: bash
        run: |
          rustup show
          rustup target add "${{ matrix.target }}"
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Build workspace binaries
        shell: bash
        run: cargo build --release --locked --workspace --bins --target "${{ matrix.target }}"
      - name: Package workspace binaries
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir package
          cargo metadata --locked --no-deps --format-version 1 | jq -r '
            .workspace_members as $members |
            .packages[] | select(.id as $id | $members | index($id)) |
            .targets[] | select(.kind | index("bin")) | .name
          ' | tr -d '\r' > binaries.txt
          test -s binaries.txt
          while IFS= read -r binary; do
            suffix=""
            if [[ "$PLATFORM" == windows ]]; then suffix=".exe"; fi
            cp "target/$TARGET/release/$binary$suffix" package/
          done < binaries.txt
          cp -R README.md docs package/
          shopt -s nullglob
          licenses=(LICENSE* LICENCE* COPYING*)
          if (( ${#licenses[@]} )); then cp "${licenses[@]}" package/; fi
          if [[ "$PLATFORM" == linux ]]; then
            tar -czf "infinity-$TAG-x86_64-linux.tar.gz" -C package .
          else
            7z a "infinity-$TAG-x86_64-windows.zip" ./package/*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: infinity-*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          sha256sum "infinity-$TAG-x86_64-linux.tar.gz" "infinity-$TAG-x86_64-windows.zip" > SHA256SUMS
          gh release create "$TAG" "infinity-$TAG-x86_64-linux.tar.gz" "infinity-$TAG-x86_64-windows.zip" SHA256SUMS --title "$TAG" --generate-notes
